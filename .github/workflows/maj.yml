name: Mise à jour agenda
on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 h (heure UTC)
  workflow_dispatch:         # permet de le lancer à la main
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agenda.py
      - run: |
          git config user.name "agenda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add finances.ics
          git diff --cached --quiet || git commit -m "Mise à jour agenda"
          git push
